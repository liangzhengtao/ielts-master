<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Exam | 雅思考试</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #07070a; --surface: #12121a; --surface-2: #1a1a24;
            --border: rgba(255,255,255,0.06); --text: #eaeaf0; --text-2: #8888a0; --text-3: #555570;
            --accent: #6c5ce7; --accent-2: #a29bfe; --pink: #fd79a8; --green: #00b894;
        }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* ─── Header ─── */
        .exam-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 48px; }
        .exam-left { display: flex; align-items: center; gap: 12px; }
        .exam-logo { font-size: 16px; font-weight: 800; color: var(--accent); }
        .exam-tabs { display: flex; gap: 4px; }
        .exam-tab { padding: 5px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-2); transition: all 0.2s; font-weight: 500; }
        .exam-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .exam-right { display: flex; align-items: center; gap: 12px; }
        .timer { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--text-2); }
        .lang-btn { padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 11px; cursor: pointer; }
        .submit-btn { padding: 5px 16px; border-radius: 5px; background: var(--accent); color: white; border: none; font-size: 11px; font-weight: 600; cursor: pointer; }

        /* ─── Main ─── */
        .exam-main { display: flex; height: calc(100vh - 48px); }
        .passage-panel { flex: 1; padding: 24px; overflow-y: auto; border-right: 1px solid var(--border); }
        .question-panel { width: 380px; padding: 20px; overflow-y: auto; background: var(--surface); }

        /* ─── Passage ─── */
        .passage-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--accent-2); }
        .passage-body { font-size: 14px; line-height: 1.9; color: var(--text-2); }
        .passage-body p { margin-bottom: 12px; }

        /* ─── Audio ─── */
        .audio-bar { background: var(--surface-2); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .play-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 14px; cursor: pointer; }
        .audio-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
        .audio-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0; }
        .audio-time { font-size: 11px; color: var(--text-3); font-family: monospace; }

        /* ─── Questions ─── */
        .q-card { margin-bottom: 16px; padding: 14px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid var(--border); }
        .q-num { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
        .q-text { font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
        .q-options { display: flex; flex-direction: column; gap: 5px; }
        .q-opt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); transition: all 0.15s; font-size: 12px; }
        .q-opt:hover { border-color: var(--accent); background: rgba(108,92,231,0.04); }
        .q-opt.selected { border-color: var(--accent); background: rgba(108,92,231,0.1); }
        .q-opt-letter { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
        .q-opt.selected .q-opt-letter { border-color: var(--accent); background: var(--accent); color: white; }

        /* Writing */
        .writing-area { width: 100%; min-height: 200px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; line-height: 1.7; outline: none; resize: vertical; font-family: inherit; }
        .writing-area:focus { border-color: var(--accent); }
        .word-count { text-align: right; font-size: 11px; color: var(--text-3); margin-top: 4px; }

        /* Nav */
        .q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
        .q-btn { padding: 6px 14px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
        .q-btn-primary { background: var(--accent); color: white; }
        .q-btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .q-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .q-progress { font-size: 11px; color: var(--text-3); }

        /* Answer sheet */
        .sheet { display: none; padding: 20px; overflow-y: auto; height: calc(100vh - 48px); }
        .sheet-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
        .sheet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 20px; }
        .sheet-cell { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; transition: all 0.15s; }
        .sheet-cell.answered { background: var(--accent); color: white; border-color: var(--accent); }
        .sheet-cell:hover { border-color: var(--accent); }

        /* Review */
        .review { display: none; padding: 40px; overflow-y: auto; height: 100vh; }
        .review-header { text-align: center; margin-bottom: 32px; }
        .score-box { display: inline-flex; flex-direction: column; align-items: center; padding: 20px 36px; background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; margin-bottom: 12px; }
        .score-num { font-size: 42px; font-weight: 800; color: var(--accent); }
        .score-lbl { font-size: 11px; color: var(--text-3); }
        .review-item { padding: 12px; background: var(--surface); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
        .review-item.correct { border-left: 3px solid var(--green); }
        .review-item.wrong { border-left: 3px solid var(--pink); }
        .review-q { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
        .review-a { font-size: 13px; }
        .review-a.correct { color: var(--green); }
        .review-a.wrong { color: var(--pink); }

        /* Responsive */
        @media (max-width: 768px) {
            .exam-main { flex-direction: column; }
            .question-panel { width: 100%; height: 50vh; }
            .passage-panel { height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
            .sheet { height: auto; }
        }
    </style>
</head>
<body>
    <!-- Exam Header -->
    <div class="exam-header">
        <div class="exam-left">
            <div class="exam-logo">IELTS</div>
            <div class="exam-tabs" id="examTabs"></div>
        </div>
        <div class="exam-right">
            <div class="timer" id="timer">00:00</div>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN/中</button>
            <button class="submit-btn" onclick="showSheet()">答题卡</button>
            <button class="submit-btn" style="background:var(--green)" onclick="endExam()">交卷</button>
        </div>
    </div>

    <!-- Exam Main -->
    <div class="exam-main" id="examMain">
        <div class="passage-panel" id="passagePanel"></div>
        <div class="question-panel" id="questionPanel"></div>
    </div>

    <!-- Answer Sheet -->
    <div class="sheet" id="sheetPanel">
        <div class="sheet-title">答题卡</div>
        <div id="sheetContent"></div>
        <div style="text-align:center;margin-top:20px;">
            <button class="q-btn q-btn-primary" onclick="hideSheet()">返回考试</button>
        </div>
    </div>

    <!-- Review -->
    <div class="review" id="reviewPanel"></div>

    <script>
        // ─── State ───
        let test = null;
        let lang = 'zh';
        let section = 'listening';
        let qIdx = 0;
        let answers = {};
        let seconds = 0;
        let timerInterval = null;

        // ─── Init ───
        function init() {
            const stored = sessionStorage.getItem('ielts-test');
            lang = sessionStorage.getItem('ielts-lang') || 'zh';
            if (!stored) { window.location.href = 'index.html'; return; }
            test = JSON.parse(stored);
            document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN/中' : '中/EN';
            setupTabs();
            startTimer();
            loadQ();
        }

        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN/中' : '中/EN';
            loadQ();
        }

        function t(obj) { return typeof obj === 'object' ? (obj[lang] || obj.en || '') : obj; }

        // ─── Tabs ───
        function setupTabs() {
            const tabs = document.getElementById('examTabs');
            tabs.innerHTML = '';
            ['listening', 'reading', 'writing'].forEach(s => {
                const tab = document.createElement('button');
                tab.className = 'exam-tab' + (s === section ? ' active' : '');
                tab.textContent = lang === 'zh' ? { listening: '听力', reading: '阅读', writing: '写作' }[s] : s[0].toUpperCase() + s.slice(1);
                tab.onclick = () => { section = s; qIdx = 0; setupTabs(); loadQ(); };
                tabs.appendChild(tab);
            });
        }

        // ─── Timer ───
        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        // ─── Load Question ───
        function loadQ() {
            const secData = test[section];
            if (!secData || !secData.sections[0]) return;
            const sec = secData.sections[0];
            const qs = sec.questions || [];

            // Passage
            const pp = document.getElementById('passagePanel');
            pp.innerHTML = `<div class="passage-title">${t(sec.title)}</div>${section === 'listening' ? '<div class="audio-bar"><button class="play-btn">▶</button><div class="audio-track"><div class="audio-fill"></div></div><span class="audio-time">0:00</span></div>' : ''}<div class="passage-body">${sec.passage}</div>`;

            // Question
            const qp = document.getElementById('questionPanel');
            if (qIdx >= qs.length) {
                qp.innerHTML = `<div style="text-align:center;padding:40px;"><p style="color:var(--text-2);margin-bottom:16px;">${lang==='zh'?'本部分完成':'Section complete'}</p><button class="q-btn q-btn-primary" onclick="nextSec()">${lang==='zh'?'下一部分':'Next'} →</button></div>`;
                return;
            }

            const q = qs[qIdx];
            let html = `<div class="q-card"><div class="q-num">${lang==='zh'?'第':'Q'}${qIdx+1}${lang==='zh'?'题':' of '+qs.length}</div>`;

            if (q.type === 'writing') {
                const wc = answers[q.id] ? answers[q.id].split(/\s+/).filter(w=>w).length : 0;
                html += `<div class="q-text">${t(q.text||q.prompt)}</div><textarea class="writing-area" oninput="updWC(${q.id},${q.minWords||250})">${answers[q.id]||''}</textarea><div class="word-count">${wc} / ${q.minWords||250} ${lang==='zh'?'字':'words'}</div>`;
            } else {
                html += `<div class="q-text">${t(q.text)}</div><div class="q-options">`;
                (q.options||[]).forEach((o,i) => {
                    html += `<div class="q-opt${answers[q.id]===i?' selected':''}" onclick="sel(${q.id},${i})"><div class="q-opt-letter">${String.fromCharCode(65+i)}</div><div>${o}</div></div>`;
                });
                html += '</div>';
            }

            html += `<div class="q-nav"><button class="q-btn q-btn-ghost" onclick="prevQ()" ${qIdx===0?'disabled':''}>← ${lang==='zh'?'上一题':'Prev'}</button><span class="q-progress">${qIdx+1}/${qs.length}</span><button class="q-btn q-btn-primary" onclick="nextQ()">${qIdx===qs.length-1?(lang==='zh'?'完成':'Finish'):(lang==='zh'?'下一题':'Next →')}</button></div></div>`;
            qp.innerHTML = html;
        }

        function sel(qid, i) { answers[qid] = i; loadQ(); }
        function updWC(qid, min) {
            const ta = document.querySelector('.writing-area');
            answers[qid] = ta.value;
            const wc = ta.value.split(/\s+/).filter(w=>w).length;
            document.querySelector('.word-count').textContent = `${wc} / ${min} ${lang==='zh'?'字':'words'}`;
        }
        function nextQ() { qIdx++; loadQ(); }
        function prevQ() { if (qIdx > 0) { qIdx--; loadQ(); } }
        function nextSec() {
            if (section === 'listening') { section = 'reading'; qIdx = 0; setupTabs(); loadQ(); }
            else if (section === 'reading') { section = 'writing'; qIdx = 0; setupTabs(); loadQ(); }
            else { endExam(); }
        }

        // ─── Answer Sheet ───
        function showSheet() {
            document.getElementById('examMain').style.display = 'none';
            document.getElementById('sheetPanel').style.display = 'block';
            renderSheet();
        }
        function hideSheet() {
            document.getElementById('examMain').style.display = 'flex';
            document.getElementById('sheetPanel').style.display = 'none';
        }
        function renderSheet() {
            const content = document.getElementById('sheetContent');
            let html = '';
            ['listening', 'reading', 'writing'].forEach(s => {
                const sec = test[s];
                if (!sec) return;
                html += `<div style="margin-bottom:16px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">${lang==='zh'?{listening:'听力',reading:'阅读',writing:'写作'}[s]:s.toUpperCase()}</div><div class="sheet-grid">`;
                sec.sections.forEach(seg => {
                    seg.questions.forEach((q,i) => {
                      const answered = answers[q.id] !== undefined;
                      html += `<div class="sheet-cell${answered?' answered':''}" onclick="goQ('${s}',${i})">${i+1}</div>`;
                    });
                });
                html += '</div></div>';
            });
            content.innerHTML = html;
        }
        function goQ(sec, idx) { section = sec; qIdx = idx; hideSheet(); setupTabs(); loadQ(); }

        // ─── End Exam ───
        function endExam() {
            clearInterval(timerInterval);
            document.getElementById('examMain').style.display = 'none';
            document.getElementById('sheetPanel').style.display = 'none';
            document.getElementById('reviewPanel').style.display = 'block';
            showReview();
        }

        function showReview() {
            let correct = 0, total = 0;
            ['listening', 'reading'].forEach(s => {
                if (test[s]) test[s].sections.forEach(seg => seg.questions.forEach(q => {
                    if (q.answer !== undefined && q.options) { total++; if (answers[q.id] === q.answer) correct++; }
                }));
            });
            const band = total > 0 ? Math.round((correct / total) * 9) : 0;
            const rp = document.getElementById('reviewPanel');
            let html = `<div class="review-header"><h1 style="font-size:28px;margin-bottom:16px;">${lang==='zh'?'考试完成':'Exam Complete'}</h1><div class="score-box"><div class="score-num">${band}</div><div class="score-lbl">${lang==='zh'?'预估分数':'Estimated Band'}</div></div><p style="color:var(--text-2);">${lang==='zh'?`答对 ${correct}/${total} 题`:`${correct}/${total} correct`}</p></div><h2 style="margin-bottom:16px;font-size:18px;">${lang==='zh'?'答案回顾':'Review'}</h2>`;
            ['listening', 'reading'].forEach(s => {
                if (test[s]) test[s].sections.forEach(seg => seg.questions.forEach(q => {
                    if (q.answer !== undefined && q.options) {
                        const ok = answers[q.id] === q.answer;
                        const yourAns = answers[q.id] !== undefined ? q.options[answers[q.id]] : (lang==='zh'?'未作答':'Not answered');
                        const correctAns = q.options[q.answer];
                      html += `<div class="review-item ${ok?'correct':'wrong'}"><div class="review-q">Q${q.id}: ${t(q.text)}</div><div class="review-a ${ok?'correct':'wrong'}">${ok?'✓':'✗'} ${yourAns} ${!ok?'→ '+correctAns:''}</div></div>`;
                    }
                }));
            });
            html += `<div style="text-align:center;margin-top:24px;"><button class="q-btn q-btn-primary" onclick="window.location.href='index.html'">${lang==='zh'?'返回':'Back'}</button></div>`;
            rp.innerHTML = html;
        }

        // ─── Start ───
        init();
    </script>
</body>
</html>
