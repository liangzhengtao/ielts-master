<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Mock Test | 雅思模拟考试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f13; --surface: #1a1a24; --surface-2: #252535;
            --accent: #6366f1; --accent-2: #a78bfa; --pink: #ec4899;
            --text: #e8e8ed; --text-2: #9898a8; --border: rgba(255,255,255,0.08);
            --success: #34d399; --warning: #fbbf24; --error: #f87171;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        
        /* Header */
        .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { font-size: 18px; font-weight: 800; color: var(--accent); }
        .section-tabs { display: flex; gap: 6px; }
        .tab { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-2); transition: all 0.2s; }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .tab:hover:not(.active) { border-color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .timer { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; color: var(--text-2); }
        .timer.running { color: var(--warning); }
        .timer.paused { color: var(--text-2); }
        .lang-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-2); transition: all 0.2s; }
        .lang-btn:hover { border-color: var(--accent); color: var(--text); }
        .lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        /* Main layout */
        .main { display: flex; height: calc(100vh - 52px); }
        .left-panel { flex: 1; padding: 24px; overflow-y: auto; border-right: 1px solid var(--border); }
        .right-panel { width: 380px; padding: 24px; overflow-y: auto; background: var(--surface); }
        
        /* Passage */
        .passage { line-height: 1.8; font-size: 15px; color: var(--text-2); }
        .passage p { margin-bottom: 14px; }
        
        /* Questions */
        .question { margin-bottom: 20px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid var(--border); }
        .question-num { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
        .question-text { font-size: 14px; margin-bottom: 12px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 6px; }
        .option { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; font-size: 13px; }
        .option:hover { border-color: var(--accent); background: rgba(99,102,241,0.05); }
        .option.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); }
        .option-letter { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
        .option.selected .option-letter { border-color: var(--accent); background: var(--accent); color: white; }
        
        /* Writing */
        .writing-area { width: 100%; min-height: 250px; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; line-height: 1.7; outline: none; resize: vertical; font-family: inherit; }
        .writing-area:focus { border-color: var(--accent); }
        .word-count { text-align: right; font-size: 12px; color: var(--text-2); margin-top: 6px; }
        
        /* Navigation */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn { padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .progress { font-size: 12px; color: var(--text-2); }
        
        /* Start screen */
        .start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; text-align: center; }
        .start-screen h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, var(--accent), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .start-screen .sub { font-size: 18px; color: var(--text-2); margin-bottom: 32px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; max-width: 800px; width: 100%; }
        .test-card { padding: 24px; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.3s; text-align: left; }
        .test-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .test-card h3 { font-size: 16px; margin-bottom: 6px; }
        .test-card p { font-size: 12px; color: var(--text-2); }
        
        /* Review */
        .review { padding: 40px; max-width: 700px; margin: 0 auto; }
        .review-header { text-align: center; margin-bottom: 32px; }
        .score-box { display: inline-flex; flex-direction: column; align-items: center; padding: 24px 40px; background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; margin-bottom: 16px; }
        .score-num { font-size: 48px; font-weight: 800; color: var(--accent); }
        .score-lbl { font-size: 12px; color: var(--text-2); }
        .review-item { padding: 14px; background: var(--surface); border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .review-item.correct { border-left: 3px solid var(--success); }
        .review-item.wrong { border-left: 3px solid var(--error); }
        .review-q { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
        .review-a { font-size: 14px; }
        .review-a.correct { color: var(--success); }
        .review-a.wrong { color: var(--error); }
        
        /* Audio */
        .audio-bar { background: var(--surface-2); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .play-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 16px; cursor: pointer; }
        .audio-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
        .audio-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0; }
        .audio-time { font-size: 12px; color: var(--text-2); font-family: monospace; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .right-panel { width: 100%; border-top: 1px solid var(--border); }
            .header { flex-wrap: wrap; gap: 8px; }
            .start-screen h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
        <h1 id="startTitle">IELTS Mock Test</h1>
        <p class="sub" id="startSub">Practice with realistic questions. No time pressure.</p>
        <div class="test-grid" id="testGrid"></div>
    </div>

    <!-- Test Screen -->
    <div id="testScreen" style="display: none;">
        <div class="header">
            <div class="header-left">
                <div class="logo">IELTS</div>
                <div class="section-tabs" id="sectionTabs"></div>
            </div>
            <div class="header-right">
                <div class="timer" id="timer">00:00</div>
                <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN/中</button>
            </div>
        </div>
        <div class="main">
            <div class="left-panel" id="leftPanel"></div>
            <div class="right-panel" id="rightPanel"></div>
        </div>
    </div>

    <!-- Review Screen -->
    <div id="reviewScreen" style="display: none;">
        <div class="review" id="reviewContent"></div>
    </div>

    <script>
        // Language
        let lang = 'en';
        function toggleLang() {
            lang = lang === 'en' ? 'zh' : 'en';
            document.getElementById('langBtn').textContent = lang === 'en' ? 'EN/中' : '中/EN';
            loadQuestion();
            updateStartScreen();
        }
        function t(obj) { return typeof obj === 'object' ? (obj[lang] || obj.en || '') : obj; }

        // State
        let currentTest = null;
        let currentSection = 'listening';
        let currentQ = 0;
        let answers = {};
        let timerSeconds = 0;
        let timerInterval = null;
        let isPlaying = false;

        // Update start screen text
        function updateStartScreen() {
            document.getElementById('startTitle').textContent = lang === 'zh' ? '雅思模拟考试' : 'IELTS Mock Test';
            document.getElementById('startSub').textContent = lang === 'zh' ? '用真题练习，没有时间压力' : 'Practice with realistic questions. No time pressure.';
        }

        // Load tests
        async function loadTests() {
            const grid = document.getElementById('testGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 3; i++) {
                try {
                    const resp = await fetch(`tests/test${i}.json`);
                    if (resp.ok) {
                        const test = await resp.json();
                        const card = document.createElement('div');
                        card.className = 'test-card';
                        card.innerHTML = `<h3>${t(test.title)}</h3><p>${lang === 'zh' ? '听力 + 阅读 + 写作' : 'Listening + Reading + Writing'}</p>`;
                        card.onclick = () => startTest(test);
                        grid.appendChild(card);
                    }
                } catch (e) {}
            }
            
            // Add built-in test
            const builtIn = document.createElement('div');
            builtIn.className = 'test-card';
            builtIn.innerHTML = `<h3>${lang === 'zh' ? '内置练习' : 'Built-in Practice'}</h3><p>${lang === 'zh' ? '快速练习题' : 'Quick practice questions'}</p>`;
            builtIn.onclick = () => startTest(getBuiltInTest());
            grid.appendChild(builtIn);
        }

        // Built-in test
        function getBuiltInTest() {
            return {
                id: 0,
                title: { en: 'Quick Practice', zh: '快速练习' },
                listening: { sections: [{ title: { en: 'Listening Practice', zh: '听力练习' }, passage: '<p>Practice listening comprehension questions.</p>', questions: [
                    { id: 1, text: { en: 'What is the main topic of the conversation?', zh: '对话的主要话题是什么？' }, options: ['Travel', 'Education', 'Food', 'Sports'], answer: 1 },
                    { id: 2, text: { en: 'Where does the conversation take place?', zh: '对话发生在哪里？' }, options: ['Library', 'Restaurant', 'Airport', 'Hospital'], answer: 0 },
                    { id: 3, text: { en: 'What time does the meeting start?', zh: '会议几点开始？' }, options: ['9:00 AM', '10:00 AM', '11:00 AM', '2:00 PM'], answer: 1 },
                ]}]},
                reading: { sections: [{ title: { en: 'Reading Passage', zh: '阅读文章' }, passage: '<p>The development of artificial intelligence has transformed many industries. From healthcare to finance, AI systems are being used to automate tasks, analyze data, and make predictions. However, this rapid advancement has also raised concerns about job displacement and ethical implications.</p><p>Many experts believe that while AI will eliminate some jobs, it will also create new ones. The key is for workers to develop skills that complement AI, such as critical thinking, creativity, and emotional intelligence.</p>', questions: [
                    { id: 4, text: { en: 'What is the main concern about AI mentioned in the passage?', zh: '文章中提到的关于AI的主要担忧是什么？' }, options: ['Speed of development', 'Job displacement', 'Cost', 'Complexity'], answer: 1 },
                    { id: 5, text: { en: 'According to experts, what should workers develop?', zh: '根据专家，工人应该发展什么？' }, options: ['Technical skills', 'Physical strength', 'Complementary skills', 'Math skills'], answer: 2 },
                ]}]},
                writing: { sections: [
                    { title: { en: 'Task 1', zh: '任务1' }, prompt: { en: 'Describe the chart showing global internet usage from 2010 to 2023.', zh: '描述2010年至2023年全球互联网使用情况的图表。' }, minWords: 150 },
                    { title: { en: 'Task 2', zh: '任务2' }, prompt: { en: 'Some people think technology makes life easier. Others think it makes life more complicated. Discuss both views and give your opinion.', zh: '有些人认为科技让生活更简单， others think it makes life more complicated. 讨论两种观点并给出你的看法。' }, minWords: 250 }
                ]}
            };
        }

        // Start test
        function startTest(test) {
            currentTest = test;
            currentSection = 'listening';
            currentQ = 0;
            answers = {};
            timerSeconds = 0;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('testScreen').style.display = 'block';
            
            // Setup tabs
            const tabs = document.getElementById('sectionTabs');
            tabs.innerHTML = '';
            ['listening', 'reading', 'writing'].forEach(sec => {
                const tab = document.createElement('button');
                tab.className = 'tab' + (sec === currentSection ? ' active' : '');
                tab.textContent = lang === 'zh' ? { listening: '听力', reading: '阅读', writing: '写作' }[sec] : sec.charAt(0).toUpperCase() + sec.slice(1);
                tab.dataset.section = sec;
                tab.onclick = () => switchSection(sec);
                tabs.appendChild(tab);
            });
            
            // Start timer
            timerInterval = setInterval(() => {
                timerSeconds++;
                const m = Math.floor(timerSeconds / 60);
                const s = timerSeconds % 60;
                document.getElementById('timer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
            
            loadQuestion();
        }

        function switchSection(sec) {
            currentSection = sec;
            currentQ = 0;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.section === sec));
            loadQuestion();
        }

        // Load question
        function loadQuestion() {
            if (!currentTest) return;
            const secData = currentTest[currentSection];
            if (!secData || !secData.sections[0]) return;
            const section = secData.sections[0];
            const questions = section.questions || [];
            
            // Left panel
            const left = document.getElementById('leftPanel');
            left.innerHTML = `
                <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">${t(section.title)}</h2>
                ${currentSection === 'listening' ? '<div class="audio-bar"><button class="play-btn" onclick="togglePlay()">▶</button><div class="audio-track"><div class="audio-fill" id="audioFill"></div></div><span class="audio-time">0:00</span></div>' : ''}
                <div class="passage">${section.passage}</div>
            `;
            
            // Right panel
            const right = document.getElementById('rightPanel');
            if (currentQ >= questions.length) {
                right.innerHTML = `<div style="text-align:center;padding:40px;"><p style="color:var(--text-2);margin-bottom:20px;">${lang === 'zh' ? '本部分完成！' : 'Section complete!'}</p><button class="btn btn-primary" onclick="nextSection()">${lang === 'zh' ? '下一部分' : 'Next Section'} →</button></div>`;
                return;
            }
            
            const q = questions[currentQ];
            let html = `<div class="question"><div class="question-num">${lang === 'zh' ? '第' : 'Question '}${currentQ + 1}${lang === 'zh' ? '题，共' : ' of '}${questions.length}${lang === 'zh' ? '题' : ''}</div>`;
            
            if (q.type === 'writing') {
                const wc = answers[q.id] ? answers[q.id].split(/\s+/).filter(w=>w).length : 0;
                html += `<div class="question-text">${t(q.text || q.prompt)}</div>
                    <textarea class="writing-area" oninput="updateWC(${q.id},${q.minWords||250})">${answers[q.id]||''}</textarea>
                    <div class="word-count">${wc} / ${q.minWords||250} ${lang === 'zh' ? '字' : 'words'}</div>`;
            } else {
                html += `<div class="question-text">${t(q.text)}</div><div class="options">`;
                (q.options || []).forEach((opt, i) => {
                    const sel = answers[q.id] === i ? ' selected' : '';
                    html += `<div class="option${sel}" onclick="selectOpt(${q.id},${i})"><div class="option-letter">${String.fromCharCode(65+i)}</div><div>${opt}</div></div>`;
                });
                html += '</div>';
            }
            
            html += `<div class="nav-bar"><button class="btn btn-ghost" onclick="prevQ()" ${currentQ===0?'disabled':''}>← ${lang === 'zh' ? '上一题' : 'Prev'}</button><span class="progress">${currentQ+1}/${questions.length}</span><button class="btn btn-primary" onclick="nextQ()">${currentQ===questions.length-1 ? (lang==='zh'?'完成':'Finish') : (lang==='zh'?'下一题':'Next →')}</button></div></div>`;
            right.innerHTML = html;
        }

        function selectOpt(qid, idx) { answers[qid] = idx; loadQuestion(); }
        function updateWC(qid, min) {
            const ta = document.querySelector('.writing-area');
            answers[qid] = ta.value;
            const wc = ta.value.split(/\s+/).filter(w=>w).length;
            document.querySelector('.word-count').textContent = `${wc} / ${min} ${lang === 'zh' ? '字' : 'words'}`;
        }
        function nextQ() { currentQ++; loadQuestion(); }
        function prevQ() { if (currentQ > 0) { currentQ--; loadQuestion(); } }
        function nextSection() {
            if (currentSection === 'listening') switchSection('reading');
            else if (currentSection === 'reading') switchSection('writing');
            else endTest();
        }
        function togglePlay() {
            isPlaying = !isPlaying;
            document.querySelector('.play-btn').textContent = isPlaying ? '⏸' : '▶';
        }

        // End test
        function endTest() {
            clearInterval(timerInterval);
            document.getElementById('testScreen').style.display = 'none';
            document.getElementById('reviewScreen').style.display = 'block';
            showReview();
        }

        function showReview() {
            let correct = 0, total = 0;
            ['listening', 'reading'].forEach(sec => {
                if (currentTest[sec]) {
                    currentTest[sec].sections.forEach(s => {
                        s.questions.forEach(q => {
                            if (q.answer !== undefined) {
                                total++;
                                if (answers[q.id] === q.answer) correct++;
                            }
                        });
                    });
                }
            });
            
            const band = total > 0 ? Math.round((correct / total) * 9) : 0;
            const review = document.getElementById('reviewContent');
            let html = `<div class="review-header"><h1 style="font-size:32px;margin-bottom:20px;">${lang === 'zh' ? '测试完成！' : 'Test Complete!'}</h1><div class="score-box"><div class="score-num">${band}</div><div class="score-lbl">${lang === 'zh' ? '预估分数' : 'Estimated Band'}</div></div><p style="color:var(--text-2);">${lang === 'zh' ? `你答对了 ${correct}/${total} 题` : `You answered ${correct} out of ${total} correctly`}</p></div><h2 style="margin-bottom:16px;">${lang === 'zh' ? '答案回顾' : 'Review Answers'}</h2>`;
            
            ['listening', 'reading'].forEach(sec => {
                if (currentTest[sec]) {
                    currentTest[sec].sections.forEach(s => {
                        s.questions.forEach(q => {
                            if (q.answer !== undefined) {
                                const ok = answers[q.id] === q.answer;
                              html += `<div class="review-item ${ok?'correct':'wrong'}"><div class="review-q">Q${q.id}: ${t(q.text)}</div><div class="review-a ${ok?'correct':'wrong'}">${ok?'✓':'✗'} ${lang==='zh'?'你的答案':'Your answer'}: ${answers[q.id]!==undefined?q.options[answers[q.id]]:(lang==='zh'?'未作答':'Not answered')} ${!q.options?'<br>'+(lang==='zh'?'正确答案':'Correct answer')+': '+q.options[q.answer]:''}</div></div>`;
                            }
                        });
                    });
                }
            });
            
            html += `<div style="text-align:center;margin-top:32px;"><button class="btn btn-primary" onclick="location.reload()">${lang === 'zh' ? '再做一套' : 'Take Another Test'}</button></div>`;
            review.innerHTML = html;
        }

        // Init
        updateStartScreen();
        loadTests();
    </script>
</body>
</html>
