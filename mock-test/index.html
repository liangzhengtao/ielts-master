<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Master | 雅思模考</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; }

        /* ─── Nav ─── */
        .nav { background: #fff; border-bottom: 1px solid #e8e8ed; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; height: 56px; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 800; color: #6c5ce7; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-link { color: #666; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-link:hover { color: #1a1a2e; }
        .lang-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #666; font-size: 13px; cursor: pointer; }
        .lang-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }

        /* ─── Layout ─── */
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .page { display: flex; gap: 24px; }
        .main { flex: 1; }
        .sidebar { width: 280px; flex-shrink: 0; }

        /* ─── Filter ─── */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #e0e0e5; background: #fff; color: #666; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }
        .filter-btn.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }

        /* ─── Book List ─── */
        .book-section { margin-bottom: 24px; }
        .book-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #fff; border: 1px solid #e8e8ed; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .book-header:hover { border-color: #6c5ce7; background: #fafafe; }
        .book-title { font-size: 15px; font-weight: 700; color: #1a1a2e; }
        .book-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #fff3e6; color: #f59e0b; font-weight: 600; }
        .book-tests { display: none; padding: 12px 20px; background: #fff; border: 1px solid #e8e8ed; border-top: none; border-radius: 0 0 10px 10px; }
        .book-tests.open { display: block; }
        .test-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
        .test-row:hover { background: #f5f5fa; }
        .test-name { font-size: 14px; font-weight: 500; color: #1a1a2e; }
        .test-tags { display: flex; gap: 6px; }
        .test-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #f0f4ff; color: #6c5ce7; }
        .test-btn { padding: 6px 16px; border-radius: 6px; background: #6c5ce7; color: #fff; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .test-btn:hover { background: #5a4bd1; }

        /* ─── Sidebar ─── */
        .sidebar-card { background: #fff; border: 1px solid #e8e8ed; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .sidebar-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #1a1a2e; }
        .sidebar-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f3; }
        .sidebar-item:last-child { border-bottom: none; }
        .sidebar-icon { font-size: 24px; }
        .sidebar-text { font-size: 13px; font-weight: 500; }
        .sidebar-sub { font-size: 12px; color: #999; }

        /* ─── Random ─── */
        .random-card { background: linear-gradient(135deg, #6c5ce7, #a29bfe); border-radius: 12px; padding: 24px; color: #fff; text-align: center; margin-bottom: 16px; cursor: pointer; transition: transform 0.2s; }
        .random-card:hover { transform: translateY(-2px); }
        .random-icon { font-size: 32px; margin-bottom: 8px; }
        .random-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .random-desc { font-size: 12px; opacity: 0.8; }

        /* ─── Login ─── */
        .login-card { background: #fff; border: 1px solid #e8e8ed; border-radius: 12px; padding: 24px; text-align: center; }
        .login-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .login-desc { font-size: 13px; color: #999; margin-bottom: 16px; }
        .login-btn { display: inline-block; padding: 10px 24px; background: #6c5ce7; color: #fff; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
        .login-btn:hover { background: #5a4bd1; }

        /* ─── Footer ─── */
        .footer { text-align: center; padding: 24px; font-size: 12px; color: #999; border-top: 1px solid #e8e8ed; margin-top: 40px; }
        .footer a { color: #6c5ce7; text-decoration: none; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .page { flex-direction: column; }
            .sidebar { width: 100%; }
            .nav { padding: 0 16px; }
            .hero-section { padding: 40px 0; }
            .hero-title { font-size: 28px; }
            .hero-subtitle { font-size: 14px; }
        }

        /* ─── Animations ─── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeInUp 0.3s ease forwards; }

        /* Hero section */
        .hero-section {
            text-align: center;
            padding: 40px 0 30px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .stat-item { text-align: center; }
        .stat-number { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        .stat-label { font-size: 11px; opacity: 0.8; }

        /* No heavy animations */
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="nav">
        <a href="#" class="logo">IELTS Master</a>
        <div class="nav-right">
            <a href="https://github.com/liangzhengtao/ielts-master" class="nav-link">GitHub</a>
            <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN/中</button>
        </div>
    </nav>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section fade-in">
            <div class="hero-title">IELTS Master</div>
            <div class="hero-subtitle">Computer-Delivered Mock Test</div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number">20+</div>
                    <div class="stat-label">Practice Tests</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">800+</div>
                    <div class="stat-label">Questions</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">4</div>
                    <div class="stat-label">Sections</div>
                </div>
            </div>
        </div>

        <div class="page">
            <!-- Main -->
            <div class="main">
                <!-- Filter -->
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterTests('all', this)" id="filterAll">全部</button>
                    <button class="filter-btn" onclick="filterTests('ielts', this)" id="filterIelts">剑雅真题</button>
                    <button class="filter-btn" onclick="filterTests('practice', this)" id="filterPractice">模拟题</button>
                </div>

                <!-- Test List -->
                <div id="testList"></div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Random -->
                <div class="random-card" onclick="randomTest()">
                    <div class="random-icon">🎲</div>
                    <div class="random-title">随机抽题</div>
                    <div class="random-desc">随机选择一套真题练习</div>
                </div>

                <!-- Features -->
                <div class="sidebar-card">
                    <div class="sidebar-title">功能特点</div>
                    <div class="sidebar-item"><div class="sidebar-icon">🎯</div><div><div class="sidebar-text">真实模拟</div><div class="sidebar-sub">还原雅思机考界面</div></div></div>
                    <div class="sidebar-item"><div class="sidebar-icon">📊</div><div><div class="sidebar-text">即时评分</div><div class="sidebar-sub">自动批改，预估分数</div></div></div>
                    <div class="sidebar-item"><div class="sidebar-icon">🌐</div><div><div class="sidebar-text">中英双语</div><div class="sidebar-sub">界面和题目均支持</div></div></div>
                    <div class="sidebar-item"><div class="sidebar-icon">📱</div><div><div class="sidebar-text">全平台</div><div class="sidebar-sub">桌面端、手机端均可</div></div></div>
                </div>

                <!-- Login -->
                <div class="login-card">
                    <div class="login-title">欢迎来到 IELTS Master</div>
                    <div class="login-desc">免费开源的雅思备考平台</div>
                    <a href="https://github.com/liangzhengtao/ielts-master" class="login-btn">查看 GitHub</a>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 IELTS Master · <a href="https://github.com/liangzhengtao">Liang Zhengtao</a> · MIT License
        </div>
    </div>

    <script>
        let lang = 'zh';
        let allTests = [];

        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN/中' : '中/EN';
            renderTests(allTests);
            updateUI();
        }

        function updateUI() {
            document.getElementById('filterAll').textContent = lang === 'zh' ? '全部' : 'All';
            document.getElementById('filterIelts').textContent = lang === 'zh' ? '剑雅真题' : 'Cambridge IELTS';
            document.getElementById('filterPractice').textContent = lang === 'zh' ? '模拟题' : 'Practice';
        }

        // Load tests - only load practice tests
        async function loadTests() {
            const tests = [];
            for (let i = 1; i <= 6; i++) {
                try {
                    const resp = await fetch(`tests/test${i}.json`);
                    if (resp.ok) {
                        const t = await resp.json();
                        tests.push(t);
                    }
                } catch (e) {}
            }
            allTests = tests;
            renderTests(tests);
        }

        // Load Cambridge test on demand
        async function loadCambridgeTest(bookId) {
            const paddedId = String(bookId).padStart(2, '0');
            try {
                const resp = await fetch(`tests/cambridge-${paddedId}-test1.json`);
                if (resp.ok) {
                    const t = await resp.json();
                    sessionStorage.setItem('ielts-test', JSON.stringify(t));
                    sessionStorage.setItem('ielts-lang', lang);
                    window.location.href = 'exam.html';
                }
            } catch (e) {
                alert(lang === 'zh' ? '加载失败' : 'Failed to load');
            }
        }

        function renderTests(tests) {
            const list = document.getElementById('testList');
            list.innerHTML = '';

            // Cambridge IELTS books
            const books = [
                { id: 20, name: { zh: '剑雅20', en: 'Cambridge IELTS 20' }, hot: true },
                { id: 19, name: { zh: '剑雅19', en: 'Cambridge IELTS 19' } },
                { id: 18, name: { zh: '剑雅18', en: 'Cambridge IELTS 18' } },
                { id: 17, name: { zh: '剑雅17', en: 'Cambridge IELTS 17' } },
                { id: 16, name: { zh: '剑雅16', en: 'Cambridge IELTS 16' } },
                { id: 15, name: { zh: '剑雅15', en: 'Cambridge IELTS 15' } },
                { id: 14, name: { zh: '剑雅14', en: 'Cambridge IELTS 14' } },
                { id: 13, name: { zh: '剑雅13', en: 'Cambridge IELTS 13' } },
                { id: 12, name: { zh: '剑雅12', en: 'Cambridge IELTS 12' } },
                { id: 11, name: { zh: '剑雅11', en: 'Cambridge IELTS 11' } },
                { id: 10, name: { zh: '剑雅10', en: 'Cambridge IELTS 10' } },
                { id: 9, name: { zh: '剑雅9', en: 'Cambridge IELTS 9' } },
                { id: 8, name: { zh: '剑雅8', en: 'Cambridge IELTS 8' } },
                { id: 7, name: { zh: '剑雅7', en: 'Cambridge IELTS 7' } },
                { id: 6, name: { zh: '剑雅6', en: 'Cambridge IELTS 6' } },
                { id: 5, name: { zh: '剑雅5', en: 'Cambridge IELTS 5' } },
            ];

            books.forEach((book, idx) => {
                const section = document.createElement('div');
                section.className = 'book-section';
                section.dataset.type = 'ielts';

                const header = document.createElement('div');
                header.className = 'book-header';
                header.innerHTML = `<span class="book-title">${lang === 'zh' ? book.name.zh : book.name.en}</span>${book.hot ? '<span class="book-badge">HOT</span>' : ''}`;
                header.onclick = () => {
                    const tests = section.querySelector('.book-tests');
                    tests.classList.toggle('open');
                };

                const testsDiv = document.createElement('div');
                testsDiv.className = 'book-tests';

                // Show4 tests per book, or link to actual test data
                for (let t = 1; t <= 4; t++) {
                    const row = document.createElement('div');
                    row.className = 'test-row';
                    row.innerHTML = `
                        <span class="test-name">Test ${t}</span>
                        <div class="test-tags">
                            <span class="test-tag">${lang === 'zh' ? '听力' : 'L'}</span>
                            <span class="test-tag">${lang === 'zh' ? '阅读' : 'R'}</span>
                            <span class="test-tag">${lang === 'zh' ? '写作' : 'W'}</span>
                        </div>
                        <button class="test-btn" onclick="loadCambridgeTest(${book.id})">${lang === 'zh' ? '开始' : 'Start'}</button>
                    `;
                    testsDiv.appendChild(row);
                }

                section.appendChild(header);
                section.appendChild(testsDiv);
                list.appendChild(section);
            });

            // Practice tests section
            const practiceSection = document.createElement('div');
            practiceSection.className = 'book-section';
            practiceSection.dataset.type = 'practice';
            const practiceHeader = document.createElement('div');
            practiceHeader.className = 'book-header';
            practiceHeader.innerHTML = `<span class="book-title">${lang === 'zh' ? '模拟练习题' : 'Practice Tests'}</span><span class="book-badge">NEW</span>`;
            practiceHeader.onclick = () => {
                practiceSection.querySelector('.book-tests').classList.toggle('open');
            };
            const practiceTests = document.createElement('div');
            practiceTests.className = 'book-tests';
            tests.forEach((t, i) => {
              const row = document.createElement('div');
              row.className = 'test-row';
              row.innerHTML = `
                  <span class="test-name">${t.title ? (lang === 'zh' ? t.title.zh || t.title.en : t.title.en) : 'Test ' + (i+1)}</span>
                  <div class="test-tags">
                      <span class="test-tag">${lang === 'zh' ? '听力' : 'L'}</span>
                      <span class="test-tag">${lang === 'zh' ? '阅读' : 'R'}</span>
                      <span class="test-tag">${lang === 'zh' ? '写作' : 'W'}</span>
                  </div>
                  <button class="test-btn" onclick="startTest(${i})">${lang === 'zh' ? '开始' : 'Start'}</button>
              `;
              practiceTests.appendChild(row);
            });
            practiceSection.appendChild(practiceHeader);
            practiceSection.appendChild(practiceTests);
            list.appendChild(practiceSection);
        }

        function filterTests(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.book-section').forEach(s => {
                s.style.display = (type === 'all' || s.dataset.type === type) ? 'block' : 'none';
            });
        }

        function startTest(idx) {
            const test = allTests[idx % allTests.length];
            if (!test) return;
            sessionStorage.setItem('ielts-test', JSON.stringify(test));
            sessionStorage.setItem('ielts-lang', lang);
            window.location.href = 'exam.html';
        }

        function randomTest() {
            if (allTests.length === 0) return;
            const idx = Math.floor(Math.random() * allTests.length);
            startTest(idx);
        }

        // Init - show loading
        const testList = document.getElementById('testList');
        testList.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Loading tests...</div>';
        loadTests();
    </script>
</body>
</html>
